name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate guidelines
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate
        run: |
          Tests/run_tests.swift
          Tests/run_review_policy_tests.swift
          Scripts/validate_guidelines.swift
          Scripts/sync_codex_review_policy.swift check --local-source . --profile central

  review-policy:
    name: Review policy
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require CI to pass
        env:
          CI_PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: |
          if [[ "$CI_PASSED" != "true" ]]; then
            echo "::error::A CI job failed, was cancelled, or was skipped."
            exit 1
          fi
